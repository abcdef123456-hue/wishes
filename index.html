<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Wish From The Heart</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
        }
        .heart {
            font-size: 60px;
            animation: pulse 1s infinite alternate;
            margin-bottom: 20px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }
        h1 {
            color: #ff4b6e;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            line-height: 1.6;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">❤️</div>
        <h1>Warm Wishes</h1>
        <p>Sending you a little extra sunshine today. May your heart be full, your day be bright, and everything go wonderfully well!</p>
    </div>
</body>
</html>
