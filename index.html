<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Samreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #2b0c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .card {
            background: linear-gradient(145deg, #441740, #350f32);
            border-radius: 24px;
            padding: 40px 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .avatar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(254, 207, 239, 0.4);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .message {
            font-size: 16px;
            color: #e0d0e0;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .btn-container {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 32px;
            margin-bottom: 24px;
        }

        .btn {
            background: linear-gradient(90deg, #ff5e7e, #ff4b6e);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .footer {
            font-size: 12px;
            color: #a080a0;
        }

        .heart {
            color: #ff4b6e;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <div class="avatar">🎂</div>
        </div>
        
        <h1>For Samreen</h1>
        <p class="message">Wishing you a birthday as bright and beautiful as your smile <span class="heart">✨💕</span></p>
        
        <div class="btn-container">
            <button class="btn" onclick="alert(' Sending you a little extra sunshine today. May your heart be full, your day be bright, and everything will go wonderfully well! ,Happy Birthday! May your day be packed with love, sweet surprises, and countless blessings. 🎉🎂🎈')">Open my message</button>
        </div>
        
        <div class="footer">
            Made with <span class="heart">💓</span> and endless care
        </div>
    </div>

</body>
</html>
